name: Release infrastructure acceptance
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: |
          python - <<'PY'
          import socket
          with socket.create_connection(('127.0.0.1',6379),timeout=5) as client:
              client.sendall(b'*1\r\n$4\r\nPING\r\n')
              assert client.recv(1024)==b'+PONG\r\n'
          PY
      - run: python -m unittest discover -s .release -p 'test*.py' -v
      - run: mkdir -p smoke-output && echo 'synthetic evidence' > smoke-output/proof.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke
          path: smoke-output/
